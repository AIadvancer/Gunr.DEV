<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Off the map — GUNR.DEV</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("gunr.theme"); } catch (e) {}
      if (t !== "ink" && t !== "paper") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "ink";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root { --bg: #0c0c0e; --fg: #efebe3; --fg-2: #aaa59c; --line: rgba(239, 235, 227, .16); --accent: #ff5a1f; }
    :root[data-theme="paper"] { --bg: #f1ede4; --fg: #131316; --fg-2: #55514a; --line: rgba(19, 19, 22, .18); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.5 "JetBrains Mono", ui-monospace, Consolas, monospace; display: grid; place-items: center; overflow: hidden; }
    svg.map { position: fixed; inset: -10%; width: 120%; height: 120%; z-index: 0; }
    svg.map path { fill: none; stroke: var(--line); stroke-width: 1.2; }
    svg.map path:nth-child(4n) { stroke-width: 2; }
    main { position: relative; z-index: 1; width: min(100% - 2.5rem, 40rem); text-align: center; }
    .k { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-2); }
    h1 { margin: .4rem 0 0; font: 400 clamp(7rem, 34vw, 16rem)/.82 Anton, Impact, sans-serif; letter-spacing: .01em; }
    h1 span { color: var(--accent); }
    p.s { margin: .9rem auto 1.6rem; font: italic 400 clamp(1.4rem, 4.2vw, 2rem)/1.15 "Instrument Serif", Georgia, serif; max-width: 22ch; }
    code { display: block; margin: 0 auto 1.6rem; padding: .6rem .9rem; border: 1px dashed var(--line); border-radius: 999px; font-size: .78rem; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    nav { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
    a { display: inline-flex; align-items: center; min-height: 3rem; padding: 0 1.3rem; border-radius: 999px; border: 1px solid var(--line); color: inherit; text-decoration: none; font: 600 .95rem/1 system-ui, sans-serif; }
    a.p { background: var(--accent); border-color: var(--accent); color: #0c0c0e; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <svg class="map" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M300 250c40 0 70 22 70 52s-30 50-70 50-72-20-72-50 32-52 72-52z"/>
    <path d="M300 215c64 0 112 36 112 86s-48 84-112 84-116-34-116-84 52-86 116-86z"/>
    <path d="M298 178c88-4 158 50 158 122s-70 122-158 122-160-50-160-122 72-118 160-122z"/>
    <path d="M296 138c116-8 206 66 206 162s-90 164-206 164S88 396 88 300s92-154 208-162z"/>
    <path d="M292 96c146-12 258 84 258 204S438 506 292 506 36 420 36 300 146 108 292 96z"/>
    <path d="M288 52c176-16 312 102 312 248S464 550 288 550-16 446-16 300 112 68 288 52z"/>
    <path d="M284 6c206-20 368 120 368 294S490 596 284 596-70 472-70 300 78 26 284 6z"/>
  </svg>
  <main>
    <p class="k">Error 404 · no elevation data</p>
    <h1>4<span>0</span>4</h1>
    <p class="s">You've walked off the edge of the map.</p>
    <code id="path">this page doesn't exist</code>
    <nav>
      <a class="p" href="/">Back to the site</a>
      <a href="/card.html">Networking card</a>
    </nav>
  </main>
  <script>
    document.getElementById("path").textContent = "no such page: " + location.pathname;
  </script>
</body>
</html>
