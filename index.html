<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Social / search preview copy. Crawlers do not run JavaScript, so these few
       known facts are duplicated here; keep them in sync with js/content.js.
       journey.js overwrites <title> and the description from PROFILE at runtime. -->
  <title>Gunnar Patterson · GUNR</title>
  <meta name="description" content="Gunnar Patterson (GUNR): IT Specialist at Moorhead Holdings and long-time AI researcher. Run the forward pass and save my contact.">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="color-scheme" content="dark">

  <!-- Absolute URLs are required by Open Graph (domain: gunr.dev). -->
  <link rel="canonical" href="https://gunr.dev/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gunr.dev/">
  <meta property="og:site_name" content="GUNR.DEV">
  <meta property="og:title" content="Gunnar Patterson · GUNR">
  <meta property="og:description" content="IT Specialist at Moorhead Holdings. Years of AI research. Run the forward pass and save my contact.">
  <!-- Preview image: once assets/og.png (1200x630) exists, add og:image (+ :width/:height/:alt)
       and twitter:image pointing at https://gunr.dev/assets/og.png, and set twitter:card to
       summary_large_image. Left out until then so crawlers don't report a broken image. -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Gunnar Patterson · GUNR">
  <meta name="twitter:description" content="IT Specialist at Moorhead Holdings. Years of AI research. Run the forward pass and save my contact.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" sizes="32x32">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Runs before first paint. Decides the motion mode once for every script:
       ?motion=full|reduced wins, then the visitor's saved choice (localStorage
       "gunr.motion"), then the OS preference. Also restores the theme, decides
       whether the loader shows (once per session) and owns the Motion switch. -->
  <script>
    (function (w, d) {
      var h = d.documentElement;
      h.className = h.className.replace("no-js", "js");
      var KEY = "gunr.motion";
      var q = /[?&]motion=(full|reduced)\b/.exec(w.location.search);
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      if (stored !== "full" && stored !== "reduced") stored = null;
      var prefersReduced = !!(w.matchMedia && w.matchMedia("(prefers-reduced-motion: reduce)").matches);
      var full, source;
      if (q) { full = q[1] === "full"; source = "url"; }
      else if (stored) { full = stored === "full"; source = "stored"; }
      else { full = !prefersReduced; source = "system"; }

      // set("full" | "reduced"): save the choice, fade the page out and reload into it
      // (loader skipped). Without storage the choice rides along as ?motion= instead.
      function set(mode) {
        var f = mode === "full" || mode === true, v = f ? "full" : "reduced", ok = false;
        try { localStorage.setItem(KEY, v); ok = localStorage.getItem(KEY) === v; } catch (e) {}
        try { sessionStorage.setItem("gunr.booted", "1"); } catch (e) {}
        // Remembered for journey.js: same scroll position after the reload, focus back
        // on the switch if it had it, and a toast announcing the new mode.
        try {
          var a = d.activeElement;
          sessionStorage.setItem("gunr.motionReturn", JSON.stringify({
            y: w.scrollY || w.pageYOffset || 0,
            focus: !!(a && a.closest && a.closest("[data-motion-toggle]"))
          }));
        } catch (e) {}
        h.classList.add("motion-switching");
        setTimeout(function () {
          var l = w.location;
          var s = l.search.replace(/([?&])motion=(full|reduced)\b&?/, "$1").replace(/[?&]$/, "");
          if (!ok) s += (s ? "&" : "?") + "motion=" + v;
          if (s === l.search) l.reload();
          else l.replace(l.pathname + s + l.hash);
        }, 250);
      }
      // Keeps every [data-motion-toggle] switch's aria-checked in step with the mode.
      function sync() {
        var t = d.querySelectorAll("[data-motion-toggle]");
        for (var i = 0; i < t.length; i++) t[i].setAttribute("aria-checked", String(full));
      }
      w.GUNR_MOTION = { full: full, source: source, set: set, sync: sync };
      h.classList.add(full ? "motion-full" : "motion-reduced");
      d.addEventListener("DOMContentLoaded", sync);
      d.addEventListener("click", function (e) {
        var t = e.target && e.target.closest && e.target.closest("[data-motion-toggle]");
        if (!t) return;
        e.preventDefault();
        set(full ? "reduced" : "full");
      });
      // Back/forward cache can restore the faded-out page; bring it back.
      w.addEventListener("pageshow", function (e) { if (e.persisted) h.classList.remove("motion-switching"); });

      var LEGACY = { green: "lime", amber: "signal", cyan: "cyan", lime: "lime", signal: "signal" };
      try {
        var t = LEGACY[localStorage.getItem("gunr.theme")];
        if (t) h.setAttribute("data-theme", t);
      } catch (e) {}

      var seen = false;
      try { seen = sessionStorage.getItem("gunr.booted") === "1"; } catch (e) {}
      h.classList.add(seen || !full ? "no-boot" : "is-booting");

      // Failsafes: never keep the loader up, or content hidden, if a script failed.
      setTimeout(function () {
        if (!w.GUNR_BOOT) { h.classList.add("no-boot"); h.classList.remove("is-booting"); }
      }, 6000);
      setTimeout(function () { if (!w.GUNR_JOURNEY_READY) h.classList.add("reveal-all"); }, 4000);
    })(window, document);
  </script>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Classic scripts are fetched no-cors, the three.js module with CORS: warm both. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap"></noscript>

  <link rel="stylesheet" href="css/style.css">
  <!-- The terminal overlay is built on demand, so its CSS need not block first paint. -->
  <link rel="stylesheet" href="css/terminal.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/terminal.css"></noscript>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Loader (first visit per session, full motion only); js/boot.js drives it. -->
  <div id="boot" class="boot" role="dialog" aria-modal="true" aria-label="Loading">
    <div class="boot-top">
      <span class="boot-mark"><i aria-hidden="true"></i>GUNR</span>
      <button type="button" class="boot-skip" id="boot-skip">Skip intro <span aria-hidden="true">&rarr;</span></button>
    </div>
    <div class="boot-bottom">
      <p class="boot-label"><span>Loading weights</span> <span class="boot-file" id="boot-file">model.safetensors</span></p>
      <p class="boot-count" aria-hidden="true"><span class="boot-digit"><i>0</i></span><span class="boot-digit"><i>0</i></span><span class="boot-digit"><i>0</i></span></p>
      <div class="boot-bar" aria-hidden="true"><i id="boot-bar"></i></div>
    </div>
  </div>
  <script>
    // "Skip intro" works even before boot.js arrives.
    document.getElementById("boot-skip").addEventListener("click", function () {
      if (!window.GUNR_BOOT) { document.documentElement.classList.add("no-boot"); document.documentElement.classList.remove("is-booting"); }
    });
  </script>

  <!-- Background layers: static backdrop (WebGL fallback), the particle scene, the hero
       media (optional loop/poster, filled by journey.js), film grain. The hero media lives
       here rather than inside the hero so its mix-blend-mode: screen reaches the canvas
       (.app is its own stacking context); it is absolutely positioned over the hero. -->
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="scene" class="scene" aria-hidden="true"></canvas>
  <div class="hero-media" id="hero-media" aria-hidden="true"><div class="hero-media-in"></div></div>
  <div class="grain" aria-hidden="true"></div>

  <div id="app" class="app">
    <header class="topbar" id="topbar">
      <a class="brand" href="#layer-input" aria-label="GUNR, back to top"><i class="brand-dot" aria-hidden="true"></i><span>GUNR</span></a>
      <p class="topbar-layer" aria-hidden="true"><span class="topbar-idx" id="topbar-idx">00</span><span class="topbar-name" id="topbar-layer">Input</span></p>
      <div class="topbar-end">
        <!-- Motion switch; the head script binds every [data-motion-toggle]. -->
        <button type="button" class="motion-toggle" role="switch" aria-checked="false" data-motion-toggle title="Background animation">
          <span class="mt-label">Motion</span><span class="mt-pill" aria-hidden="true"><i></i></span>
        </button>
        <a class="topbar-cta u-link" href="#layer-output">Contact</a>
      </div>
      <span class="topbar-progress" aria-hidden="true"><i id="progress-fill"></i></span>
    </header>

    <!-- Desktop section index; rendered by journey.js. -->
    <nav class="index" id="section-index" aria-label="Sections"></nav>

    <main id="main" tabindex="-1">
      <div id="journey" class="journey"></div>

      <noscript>
        <section class="noscript-card">
          <p class="label">Gunnar Patterson &middot; GUNR</p>
          <h1>Gunnar <em>Patterson</em></h1>
          <p>IT Specialist at Moorhead Holdings (formerly Moorhead Brothers). IT infrastructure by day, years of hands-on AI research alongside it.</p>
          <p>This site is an interactive forward pass and needs JavaScript for the full experience. The essentials:</p>
          <ul>
            <li><a href="https://github.com/AIadvancer">GitHub: github.com/AIadvancer</a></li>
            <li><a href="card.html">Printable card and QR code</a></li>
          </ul>
        </section>
      </noscript>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <!-- Mobile sticky contact dock; rendered by journey.js. -->
    <nav class="dock" id="dock" aria-label="Quick contact"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Terminal easter egg toggle; js/terminal.js binds it. -->
  <button type="button" id="term-toggle" class="term-toggle" aria-label="Open terminal" title="Terminal (`)">&gt;_</button>

  <!-- QR library is async so a slow or blocked CDN never delays the page;
       journey.js fills the QR once gunr:qr-ready fires. -->
  <script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" onload="document.dispatchEvent(new Event('gunr:qr-ready'))" onerror="document.dispatchEvent(new Event('gunr:qr-failed'))"></script>
  <script defer src="js/content.js"></script>
  <script defer src="js/vcard.js"></script>
  <script defer src="js/qr.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
  <script defer src="js/boot.js"></script>
  <script defer src="js/journey.js"></script>
  <script defer src="js/terminal.js"></script>
  <script type="module" src="js/scene.js"></script>
</body>
</html>
